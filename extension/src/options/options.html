<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Viral Radar — Extension Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #070a12; color: #f1f5f9; padding: 32px; max-width: 580px; margin: 0 auto; }
    h1 { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: #fff; }
    p.sub { font-size: 12px; color: #94a3b8; margin-bottom: 24px; }
    .card { background: #0d1322; border: 1px solid #1e294b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #cbd5e1; margin-bottom: 6px; }
    input[type="text"], select {
      width: 100%; background: #131a2e; border: 1px solid #2d375e; border-radius: 8px; padding: 10px; color: #fff; font-size: 12px; outline: none;
    }
    input[type="range"] { width: 100%; }
    .btn { padding: 10px 18px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn:hover { background: #4338ca; }
    .saved-toast { display: none; color: #10b981; font-size: 12px; font-weight: 600; margin-left: 12px; }
  </style>
</head>
<body>
  <h1>⚡ AI Viral Radar Settings</h1>
  <p class="sub">Configure Chrome extension connection parameters and preferences</p>

  <div class="card">
    <div class="field">
      <label>Backend API Endpoint</label>
      <input type="text" id="api-url" value="http://127.0.0.1:8000/api" />
    </div>

    <div class="field">
      <label>Default AI Provider</label>
      <select id="ai-model">
        <option value="gemini">Google Gemini (Gemini 2.5 Flash)</option>
        <option value="offline">Offline Cognitive Engine (Demo Mode)</option>
      </select>
    </div>

    <div class="field">
      <label>Minimum Viral Score Threshold (<span id="score-val">70</span>/100)</label>
      <input type="range" id="min-score" min="30" max="95" value="70" />
    </div>

    <div class="field">
      <label>Preferred Post Tone</label>
      <select id="pref-tone">
        <option value="technical">Technical & Architectural</option>
        <option value="professional">Professional / Executive</option>
        <option value="bold">Bold / Contrarian Hot Take</option>
        <option value="casual">Casual / Conversational</option>
        <option value="minimal">Minimal / Concise</option>
      </select>
    </div>

    <div style="display: flex; align-items: center; margin-top: 20px;">
      <button class="btn" id="btn-save">Save Preferences</button>
      <span class="saved-toast" id="save-toast">✓ Saved successfully!</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
