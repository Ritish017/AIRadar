<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Viral Radar V3 - Intelligence Copilot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 420px;
      min-height: 580px;
      max-height: 600px;
      background: #070a12;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 10px 14px;
      background: #0d1322;
      border-bottom: 1px solid #1e294b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 900;
      background: linear-gradient(to right, #f59e0b, #ec4899, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }
    .badge-v3 {
      font-size: 9px;
      font-weight: 800;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
    }
    .btn-icon {
      background: #131a2e;
      border: 1px solid #1e294b;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-icon:hover {
      background: #1e294b;
      color: #fff;
    }
    /* V3 Four Tabs */
    .nav-tabs {
      display: flex;
      background: #0d1322;
      border-bottom: 1px solid #1e294b;
      padding: 6px 10px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 4px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      font-family: monospace;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: #1e294b;
      color: #fbbf24;
      border-bottom: 2px solid #f59e0b;
    }

    .feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      background: rgba(19, 26, 46, 0.7);
      border: 1px solid #1e294b;
      border-radius: 8px;
      padding: 10px;
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .pill {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .pill-confirmed {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .pill-exploding {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 5px;
    }
    .card-desc {
      font-size: 10.5px;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .card-meta {
      font-size: 9.5px;
      color: #94a3b8;
      font-family: monospace;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      border-top: 1px solid #1e294b;
      padding-top: 5px;
    }
    .btn-create {
      background: linear-gradient(to right, #f59e0b, #ea580c);
      color: #000;
      font-weight: 800;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    footer {
      padding: 8px 14px;
      background: #0d1322;
      border-top: 1px solid #1e294b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-title">AI VIRAL RADAR</span>
      <span class="badge-v3">V3 LIVE</span>
    </div>
    <button id="btn-refresh" class="btn-icon">↻ Sync</button>
  </header>

  <!-- V3 Tabs: LIVE, TRENDS, OPPORTUNITIES, CREATE -->
  <div class="nav-tabs">
    <button id="tab-live" class="tab-btn active">⚡ LIVE</button>
    <button id="tab-trends" class="tab-btn">📈 TRENDS</button>
    <button id="tab-opps" class="tab-btn">🎯 OPPS</button>
    <button id="tab-create" class="tab-btn">✍ CREATE</button>
  </div>

  <div id="content-container" class="feed-container">
    <div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 11px;">
      Connecting to local intelligence engine...
    </div>
  </div>

  <footer>
    <a href="http://localhost:5173" target="_blank" id="link-dashboard">Terminal Dashboard ↗</a>
    <span style="font-size: 10px; color: #64748b; font-family: monospace;">Time-to-Radar: ~28s</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
