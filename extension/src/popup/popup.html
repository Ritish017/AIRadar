<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Viral Radar - Trend Intelligence</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 400px;
      min-height: 560px;
      max-height: 600px;
      background: #070a12;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 12px 16px;
      background: #0d1322;
      border-bottom: 1px solid #1e294b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      background: linear-gradient(to right, #06b6d4, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }
    .badge-v2 {
      font-size: 9px;
      font-weight: 700;
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .btn-icon {
      background: #131a2e;
      border: 1px solid #1e294b;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-icon:hover {
      background: #1e294b;
      color: #fff;
    }
    /* Tab Switcher */
    .nav-tabs {
      display: flex;
      background: #0d1322;
      border-bottom: 1px solid #1e294b;
      padding: 6px 12px;
      gap: 6px;
    }
    .tab-btn {
      flex: 1;
      padding: 5px 8px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #1e294b;
      color: #06b6d4;
    }

    /* Opportunity Banner */
    .opp-banner {
      margin: 10px 12px 4px 12px;
      padding: 12px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(99, 102, 241, 0.15));
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 10px;
    }
    .opp-banner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .opp-banner-tag {
      font-size: 9px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .opp-score-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .opp-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .opp-meta {
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .opp-btn-action {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      background: linear-gradient(to right, #06b6d4, #3b82f6);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .opp-btn-action:hover {
      opacity: 0.92;
    }

    .feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .feed-card {
      background: rgba(19, 26, 46, 0.7);
      border: 1px solid #1e294b;
      border-radius: 8px;
      padding: 10px;
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .viral-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
    .card-source {
      font-size: 10px;
      color: #94a3b8;
    }
    .card-title {
      font-size: 11.5px;
      font-weight: 600;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-action {
      flex: 1;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      border: none;
    }
    .btn-analyze {
      background: #1e294b;
      color: #cbd5e1;
      border: 1px solid #2d375e;
    }
    .btn-create {
      background: #0284c7;
      color: #fff;
    }

    footer {
      padding: 8px 16px;
      background: #0d1322;
      border-top: 1px solid #1e294b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    #popup-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      padding: 14px;
      z-index: 100;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-title">⚡ AI VIRAL RADAR</span>
      <span class="badge-v2">V2 ENGINE</span>
    </div>
    <button id="btn-refresh" class="btn-icon">↻ Sync</button>
  </header>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button id="tab-opps" class="tab-btn active">⚡ Opportunities</button>
    <button id="tab-radar" class="tab-btn">📡 Trend Radar</button>
    <button id="tab-feed" class="tab-btn">📰 Feed</button>
  </div>

  <!-- Top Opportunity Highlight Banner -->
  <div id="top-opp-banner" class="opp-banner">
    <div class="opp-banner-top">
      <span class="opp-banner-tag">⚡ YOUR BEST OPPORTUNITY</span>
      <span id="opp-score" class="opp-score-pill">Score 94</span>
    </div>
    <div id="opp-title" class="opp-title">DeepSeek V3 Architecture & Benchmarks</div>
    <div id="opp-meta" class="opp-meta">
      <strong>Action:</strong> <span style="color: #34d399;">POST NOW</span> • Accelerating (+184%) • Low Competition
    </div>
    <button id="opp-create-btn" class="opp-btn-action">🚀 Create Post With Best Angle</button>
  </div>

  <div id="feed-container" class="feed-container">
    <div class="loading-state" style="padding: 20px; text-align: center; color: #94a3b8; font-size: 11px;">
      Loading active trend intelligence...
    </div>
  </div>

  <div id="popup-modal"></div>

  <footer>
    <a href="http://localhost:5173" target="_blank" id="link-dashboard">Open Web Dashboard ↗</a>
    <a href="../options/options.html" id="link-settings">Settings ⚙</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
